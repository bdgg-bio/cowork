let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2800);
}
const findDist  = id => S.distributors.find(d => d.id === id);
const findEvent = id => S.events.find(e => e.id === id);

function copyText(txt, okMsg){
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? okMsg : "Copying was blocked here. Use the download instead.");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast(okMsg), fallback);
  } else fallback();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t) return;

  if (t.dataset.tab)   { tab = t.dataset.tab; render(); window.scrollTo({ top:0 }); return; }
  if (t.dataset.clsec) { clOpen[t.dataset.clsec] = !clOpen[t.dataset.clsec]; render(); return; }
  if (t.dataset.tag) {
    const c = clFor(clEvent), tg = t.dataset.tag, i = c.tags.indexOf(tg);
    if (i > -1) c.tags.splice(i, 1);
    else if (c.tags.length < TAG_CAP) c.tags.push(tg);
    else { toast("Four tags at most — unpick one first."); return; }
    commit(); return;
  }
  if (t.dataset.delspk) {
    clFor(clEvent).speakers.splice(parseInt(t.dataset.delspk, 10), 1);
    commit(); return;
  }
  if (t.dataset.opench) {
    clEvent = t.dataset.opench; tab = "checklist"; render(); window.scrollTo({ top:0 }); return;
  }

  switch (t.id) {
    case "toggleEdit": editRows = !editRows; render(); return;
    case "addDist":
      S.distributors.push({ id:uid(), country:"", distributor:"", terms:"", uncertain:false,
        q3:0, booked:0, target:0, plan26:0, plan27:0, budget:0, months:{} });
      editRows = true; commit(); return;
    case "reseed": {
      const keep = { approvals:S.approvals, approvalsCheckedOn:S.approvalsCheckedOn };
      S = Object.assign(seedState(), keep);
      clEvent = null; commit();
      toast("Reloaded the distributors and events as the sheet supplied them."); return;
    }
    case "togglePast": S.showPast = !S.showPast; commit(); return;
    case "pasteGo": {
      const raw = document.getElementById("pasteBox").value;
      if (!raw.trim()) { toast("Paste the cells first, then read them."); return; }
      const sep = raw.indexOf("\t") > -1 ? "\t" : (raw.indexOf(";") > -1 ? ";" : ",");
      openMapper(raw.replace(/\r/g, "").split("\n").map(l => l.split(sep)));
      return;
    }
    case "mapGo": applyMapper(false); return;
    case "mapCancel": mapper = null; render(); return;
    case "markReviewed":
      S.approvalsCheckedOn = todayISO(); commit();
      toast("Today’s email input marked as given."); return;
    case "apprAdd": {
      const ref = document.getElementById("apprRef").value.trim();
      if (!ref) { toast("An order needs a reference before it can wait on anything."); return; }
      S.approvals.push({ id:uid(), ref,
        received: document.getElementById("apprDate").value || todayISO(),
        note: document.getElementById("apprNote").value.trim(), done:false });
      commit(); toast("Added to the waiting list."); return;
    }
    case "evAdd": {
      const nm = document.getElementById("evName").value.trim();
      const co = document.getElementById("evCountry").value.trim();
      if (!nm || !co) { toast("An event needs at least a country and a name."); return; }
      S.events.push({ id:uid(), country:co,
        distributor: document.getElementById("evDist").value.trim(),
        name:nm, kind:"BRD", month:"", rawNote:"", dayKnown:true, flag:"",
        date: document.getElementById("evDate").value || todayISO(),
        speaker: document.getElementById("evSpeaker").value.trim(),
        status:{ travel:"no_update", samples:"no_update", materials:"no_update",
                 social:"no_update", certs:"no_update" } });
      commit(); toast("Event added — all five items start at “no update yet”."); return;
    }
    case "addSpeaker":
      clFor(clEvent).speakers.push({ title:"", name:"", abstract:"", cv:"", hoTitle:"", hoAbstract:"" });
      commit(); return;
    case "chasePartner":
      copyText(buildChaseNote(clEvent, "partner"), "Partner’s outstanding items copied."); return;
    case "chaseSpeaker":
      copyText(buildChaseNote(clEvent, "speaker"), "Speaker’s outstanding items copied."); return;
    case "clDownload": {
      const e = findEvent(clEvent);
      saveFile("brd-checklist-" +
        String(e.country || "event").toLowerCase().replace(/[^a-z0-9]+/g, "-") +
        "-" + e.date + ".txt", buildChecklistText(clEvent));
      return;
    }
    case "copyReport": copyText(buildReport(), "Report copied."); return;
    case "dlReport": saveFile("botiss-daily-status-" + todayISO() + ".txt", buildReport()); return;
  }

  if (t.dataset.delDist) {
    S.distributors = S.distributors.filter(d => d.id !== t.dataset.delDist); commit(); return;
  }
  if (t.dataset.ok) {
    const a = S.approvals.find(x => x.id === t.dataset.ok);
    if (a) { a.done = true; a.doneOn = todayISO(); commit(); toast("Marked ok sent to customer service."); }
    return;
  }
  if (t.dataset.reopen) {
    const a = S.approvals.find(x => x.id === t.dataset.reopen);
    if (a) { a.done = false; delete a.doneOn; commit(); }
    return;
  }
  if (t.dataset.delAppr) {
    S.approvals = S.approvals.filter(a => a.id !== t.dataset.delAppr); commit(); return;
  }
  if (t.dataset.delEv) {
    const id = t.dataset.delEv;
    S.events = S.events.filter(e => e.id !== id);
    delete S.checklists[id];
    if (clEvent === id) clEvent = null;
    commit(); return;
  }
  if (t.dataset.fixbrand) {
    const e = findEvent(t.dataset.fixbrand);
    if (e) {
      e.name = e.name.replace(/regeneration\s+day(?!s)\b/gi, "REGENERATION DAYS");
      commit(); toast("Brand corrected to “" + BRAND + "”.");
    }
    return;
  }
});

/* Text fields save without a re-render, so the caret never jumps
   mid-typing; the progress chip catches up shortly after typing stops. */
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.cl)     { clFor(clEvent).values[el.dataset.cl] = el.value; commit(false); progSoon(); return; }
  if (el.dataset.clqty)  { clFor(clEvent).values[el.dataset.clqty + "__qty"] = el.value; commit(false); return; }
  if (el.dataset.clnote) { clFor(clEvent).values[el.dataset.clnote + "__note"] = el.value; commit(false); return; }
  if (el.dataset.cltt)   { clFor(clEvent).tt[el.dataset.cltt] = el.value; commit(false); progSoon(); return; }
  if (el.dataset.spk !== undefined && el.dataset.spkf) {
    const c = clFor(clEvent), i = parseInt(el.dataset.spk, 10);
    if (c.speakers[i]) { c.speakers[i][el.dataset.spkf] = el.value; commit(false); progSoon(); }
    return;
  }
  if (el.dataset.evfield && el.dataset.ev) {
    const e = findEvent(el.dataset.ev);
    if (e) { e[el.dataset.evfield] = el.value; commit(false); }
    return;
  }
  if (el.dataset.edit && el.dataset.id) {
    const d = findDist(el.dataset.id);
    if (!d) return;
    const k = el.dataset.edit;
    d[k] = ["q3","booked","target","plan26","plan27"].indexOf(k) > -1 ? parseMoney(el.value) : el.value;
    if (k === "target") d.budget = Math.round(parseMoney(el.value) * 0.05 * 100) / 100;
    commit(false);
    return;
  }
});

let progTimer = null;
function progSoon(){
  clearTimeout(progTimer);
  progTimer = setTimeout(() => {
    if (tab !== "checklist" || !clEvent) return;
    const el = document.getElementById("clProg");
    if (!el) return;
    const p = clProgress(clEvent);
    el.textContent = p.done + " of " + p.total + " required fields in · " + p.pct + "%";
  }, 700);
}

document.addEventListener("change", ev => {
  const el = ev.target;

  if (el.id === "xlsFile" && el.files && el.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(reader.result, { type:"array" });
        const name = wb.SheetNames.find(n => /revenue/i.test(n)) || wb.SheetNames[0];
        openMapper(XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:"" }));
      } catch (e) {
        toast("Could not read that file. Try saving it as .xlsx or paste the cells.");
      }
    };
    reader.onerror = () => toast("Could not read that file.");
    reader.readAsArrayBuffer(el.files[0]);
    return;
  }
  if (el.id === "asOfIn") { S.asOf = el.value || todayISO(); commit(); return; }
  if (el.id === "clPick") { clEvent = el.value; render(); return; }

  if (el.dataset.clcheck) { clFor(clEvent).values[el.dataset.clcheck] = el.checked; commit(); return; }
  if (el.dataset.clset) {
    const c = clFor(clEvent), key = el.dataset.clset, sub = el.dataset.sub;
    const cur = Array.isArray(c.values[key]) ? c.values[key].slice() : [];
    const i = cur.indexOf(sub);
    if (el.checked && i === -1) cur.push(sub);
    if (!el.checked && i > -1) cur.splice(i, 1);
    c.values[key] = cur;
    commit(); return;
  }
  if (el.dataset.ev && el.dataset.item) {
    const e = findEvent(el.dataset.ev);
    if (e) { e.status = Object.assign({}, e.status || {}, { [el.dataset.item]: el.value }); commit(); }
    return;
  }
  if (el.dataset.evfield && el.dataset.ev) { commit(); return; }
});

/* ---------- files ---------- */

let downloads = null;
function saveFile(name, text){
  if (!downloads) { copyText(text, "Downloads are unavailable here — copied instead."); return; }
  downloads.save({ filename:name, data:text })
    .then(() => toast("Saved."))
    .catch(err => {
      const code = err && err.code;
      if (code === "declined") return;
      if (code === "rate_limited") { toast("Wait a moment, then try the download again."); return; }
      copyText(text, "Could not save a file here — copied instead.");
    });
}

/* =====================================================================
   10. BOOT — render first, light capabilities up as they arrive.
   ===================================================================== */

function start(hot){
  if (hot && hot.tab) tab = hot.tab;
  if (hot && hot.clEvent) clEvent = hot.clEvent;
  renderStorePill();
  render();
}

if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(() => ({ tab, clEvent }));
}
if (window.claude && window.claude.hot && window.claude.hot.ready) {
  window.claude.hot.ready(start);
} else {
  start((window.claude && window.claude.hot && window.claude.hot.data) || {});
}

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("db").then(db => {
    if (!db) return;
    const ref = db.doc("state/board");
    ref.onSnapshot(snap => {
      if (snap.exists) {
        const remote = snap.data();
        if (remote && remote.v === 2 && !snap.metadata.hasPendingWrites) {
          const mine = Date.parse(S.updatedAt || 0) || 0;
          const theirs = Date.parse(remote.updatedAt || 0) || 0;
          if (theirs >= mine) {
            S = JSON.parse(JSON.stringify(remote));
            if (!S.checklists) S.checklists = {};
            saveLocal();
            render();
          }
        }
      }
      if (storeMode !== "shared") { storeMode = "shared"; renderStorePill(); }
    }, err => {
      dbRef = null; storeMode = "local"; renderStorePill();
      if (err && err.code !== "not_granted") {
        toast("Shared store unavailable — this board is saved on this device only.");
      }
    });
    dbRef = ref;
    ref.get().then(snap => {
      if (!snap.exists) { storeMode = "shared"; renderStorePill(); }
    }).catch(() => {});
  }).catch(() => {});

  window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
}
</script>
