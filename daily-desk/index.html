<title>botiss Daily Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============================================================
   botiss Daily Desk — the morning check-in board.
   Distributor pace against the quarter, orders waiting on an ok,
   BRD event readiness, and the event checklist as a live form.

   Identity: a departure board. Marine ink, slate-cool paper,
   monospace figures, rules instead of cards, and a severity
   rail spent only on rows that need attention. Diverging poles
   validated for CVD separation in both themes.
   ============================================================ */

:root{
  --ground:#EBEFF2;
  --surface:#FFFFFF;
  --surface-2:#F5F8FA;
  --sunk:#E1E7EC;
  --line:#D2DBE2;
  --line-soft:#E5EBF0;

  --ink:#0E1620;
  --ink-2:#35485B;
  --ink-3:#64798C;
  --ink-inv:#F2F6F9;

  /* accent — structure only, never a data colour */
  --marine:#22496F;
  --marine-deep:#173650;
  --marine-wash:#E2EAF2;
  --marine-line:#B9CBDD;

  /* diverging poles (validated light: ΔE 10.9 deutan, 26.2 normal) */
  --behind:#BE3A22;
  --ahead:#008471;
  --behind-wash:#FBE7E2;
  --ahead-wash:#DFEFEC;

  /* status — reserved, never a series colour */
  --waiting:#8A6212;
  --waiting-wash:#F8F0DA;
  --done:#008471;
  --done-wash:#DFEFEC;
  --idle:#64798C;
  --idle-wash:#E9EEF2;

  /* checklist field owners — the source document's green and red fields */
  --partner:#1F6B3A;
  --partner-wash:#E2EFE6;
  --speaker:#A8341F;
  --speaker-wash:#FAE6E1;

  --track:#E1E7EC;
  --rule:#C6D2DB;
  --heat:#22496F;

  --shadow:0 1px 2px rgba(14,22,32,.05), 0 10px 28px -20px rgba(14,22,32,.35);

  --f-disp:'Chivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0A1017; --surface:#121A22; --surface-2:#17212A; --sunk:#0D141B;
    --line:#25323D; --line-soft:#1B242D;
    --ink:#E6ECF2; --ink-2:#B0BFCC; --ink-3:#7E90A0; --ink-inv:#0A1017;
    --marine:#79A8CE; --marine-deep:#A8C8E4; --marine-wash:#14222F; --marine-line:#284457;
    /* validated dark: ΔE 9.5 deutan, 25.2 normal */
    --behind:#D66048; --ahead:#1F9F86; --behind-wash:#2D1712; --ahead-wash:#0D2320;
    --waiting:#D6A957; --waiting-wash:#2A2210; --done:#1F9F86; --done-wash:#0D2320;
    --idle:#7E90A0; --idle-wash:#182129;
    --partner:#63B884; --partner-wash:#10251A; --speaker:#E08D77; --speaker-wash:#2B1712;
    --track:#1E2932; --rule:#2C3B47; --heat:#79A8CE;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0A1017; --surface:#121A22; --surface-2:#17212A; --sunk:#0D141B;
  --line:#25323D; --line-soft:#1B242D;
  --ink:#E6ECF2; --ink-2:#B0BFCC; --ink-3:#7E90A0; --ink-inv:#0A1017;
  --marine:#79A8CE; --marine-deep:#A8C8E4; --marine-wash:#14222F; --marine-line:#284457;
  --behind:#D66048; --ahead:#1F9F86; --behind-wash:#2D1712; --ahead-wash:#0D2320;
  --waiting:#D6A957; --waiting-wash:#2A2210; --done:#1F9F86; --done-wash:#0D2320;
  --idle:#7E90A0; --idle-wash:#182129;
  --partner:#63B884; --partner-wash:#10251A; --speaker:#E08D77; --speaker-wash:#2B1712;
  --track:#1E2932; --rule:#2C3B47; --heat:#79A8CE;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:600; letter-spacing:-.015em; text-wrap:balance; margin:0}
p{margin:0}
button{font-family:inherit; font-size:inherit; color:inherit}
:focus-visible{outline:2px solid var(--marine); outline-offset:2px; border-radius:4px}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.mutedcell{color:var(--ink-3); font-size:11.5px}

/* ---------- day bar ---------- */
.daybar{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line)}
.daybar-in{
  max-width:940px; margin:0 auto; padding-block:11px; padding-left:16px; padding-right:16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.wordmark{font-family:var(--f-disp); font-weight:700; font-size:16.5px; letter-spacing:-.02em; white-space:nowrap}
.wordmark span{color:var(--marine)}
.today{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3);
  padding-left:11px; border-left:1px solid var(--line); white-space:nowrap}
.daybar .grow{flex:1 1 20px}

.pill{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  font-size:11.5px; font-weight:500; padding:4px 9px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
}
.pill .led{width:6px; height:6px; border-radius:999px; background:currentColor; flex-shrink:0}
.pill.shared{border-color:var(--marine-line); background:var(--marine-wash); color:var(--marine-deep)}
.pill.local{border-color:var(--line); background:var(--sunk); color:var(--ink-3)}

/* ---------- tabs ---------- */
.tabsrow{background:var(--surface); border-bottom:1px solid var(--line)}
.tabs{max-width:940px; margin:0 auto; padding-left:16px; padding-right:16px;
  display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
  padding:9px 12px 10px; border:none; background:none; cursor:pointer;
  font-size:13.5px; font-weight:500; color:var(--ink-3);
  border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--marine); border-bottom-color:var(--marine)}
.tab .count{font-family:var(--f-mono); font-size:10.5px; padding:1px 5px; border-radius:4px;
  background:var(--sunk); color:var(--ink-3)}
.tab .count.hot{background:var(--behind-wash); color:var(--behind)}
.tab .count.warm{background:var(--waiting-wash); color:var(--waiting)}

/* ---------- page ---------- */
.wrap{max-width:940px; margin:0 auto; padding-block:20px 72px; padding-left:16px; padding-right:16px}
.stack{display:flex; flex-direction:column; gap:16px}

.sect{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:15px 16px}
.sect.plain{background:none; border:none; padding:0}
.sect-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:13px}
.sect-head h2{font-size:14.5px; flex:1 1 auto; min-width:min(100%,12ch)}
.sect-head .hint{font-size:11.5px; color:var(--ink-3); margin-left:auto; text-align:right}
.eyebrow{font-family:var(--f-mono); font-size:10px; font-weight:500; letter-spacing:.14em;
  text-transform:uppercase; color:var(--marine)}
.label{font-family:var(--f-mono); font-size:10px; font-weight:500; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3)}

/* ---------- figures ---------- */
.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.fig{background:var(--surface); padding:13px 14px}
.fig .v{font-family:var(--f-disp); font-size:21px; font-weight:600; letter-spacing:-.02em;
  line-height:1.15; font-variant-numeric:tabular-nums}
.fig .k{font-size:12px; color:var(--ink-2); margin-top:5px; line-height:1.35}
.fig .s{font-size:10.5px; color:var(--ink-3); margin-top:3px}
.fig.behind .v{color:var(--behind)}
.fig.ahead .v{color:var(--ahead)}

/* ---------- chips ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font-size:11.5px; font-weight:500; padding:2px 7px; border-radius:5px;
  background:var(--sunk); color:var(--ink-2)}
.chip.behind{background:var(--behind-wash); color:var(--behind)}
.chip.ahead{background:var(--ahead-wash); color:var(--ahead)}
.chip.waiting{background:var(--waiting-wash); color:var(--waiting)}
.chip.done{background:var(--done-wash); color:var(--done)}
.chip.idle{background:var(--idle-wash); color:var(--ink-3)}
.chip.marine{background:var(--marine-wash); color:var(--marine-deep)}
.chip.partner{background:var(--partner-wash); color:var(--partner)}
.chip.speaker{background:var(--speaker-wash); color:var(--speaker)}
.chip.terms{font-family:var(--f-mono); font-size:10.5px}
.chip svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.1;
  stroke-linecap:round; stroke-linejoin:round; flex-shrink:0}
.chiprow{display:flex; flex-wrap:wrap; gap:6px; align-items:center}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:8px 13px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:500;
  cursor:pointer; transition:border-color .15s, background .15s}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--marine); border-color:var(--marine); color:#fff}
.btn.primary:hover:not(:disabled){background:var(--marine-deep); border-color:var(--marine-deep)}
.btn.sm{padding:5px 9px; font-size:12.5px; border-radius:7px}
.btn.quiet{border-color:transparent; background:none; color:var(--ink-3); padding:5px 7px}
.btn.quiet:hover{color:var(--behind); border-color:transparent}
.btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round; flex-shrink:0}
.btnrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

label.fld{display:block; font-size:11px; font-weight:600; color:var(--ink-2); margin-bottom:4px}
input,select,textarea{width:100%; font-family:inherit; font-size:14px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:8px 9px}
input[type=number],input.money{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
input[type=checkbox]{width:auto; accent-color:var(--marine)}
textarea{resize:vertical; min-height:58px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--marine);
  box-shadow:0 0 0 3px var(--marine-wash)}
.formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px}
.formgrid.wide{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* ---------- notices ---------- */
.notice{display:flex; gap:10px; padding:11px 13px; border-radius:9px; font-size:12.5px;
  line-height:1.5; background:var(--waiting-wash); color:var(--waiting);
  border:1px solid color-mix(in srgb, var(--waiting) 24%, transparent)}
.notice.info{background:var(--marine-wash); color:var(--marine-deep); border-color:var(--marine-line)}
.notice.bad{background:var(--behind-wash); color:var(--behind);
  border-color:color-mix(in srgb, var(--behind) 26%, transparent)}
.notice svg{width:16px; height:16px; flex-shrink:0; margin-top:2px;
  stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.notice .nbody{flex:1; min-width:0}
.notice strong{font-weight:600}
.notice .btn{margin-top:8px}

/* ---------- pace chart (diverging) ---------- */
.chartwrap{position:relative}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--ink-2); margin-bottom:11px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:2px; flex-shrink:0}

.pace{display:flex; flex-direction:column; gap:5px}
.pacerow{display:grid; grid-template-columns:minmax(120px,212px) minmax(0,1fr) 108px;
  gap:11px; align-items:center; padding:2px 0; border-radius:6px}
.pacerow:hover{background:var(--surface-2)}
.pacerow .who{font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pacerow .who b{font-weight:600}
.pacerow .amt{font-family:var(--f-mono); font-size:11.5px; text-align:right;
  font-variant-numeric:tabular-nums}
.pacerow .amt.behind{color:var(--behind)}
.pacerow .amt.ahead{color:var(--ahead)}

.track{position:relative; height:15px; background:var(--track); border-radius:3px}
.track .zero{position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--rule)}
.bar{position:absolute; top:1px; bottom:1px; min-width:2px}
.bar.behind{right:50%; margin-right:1px; background:var(--behind); border-radius:3px 0 0 3px}
.bar.ahead{left:50%; margin-left:1px; background:var(--ahead); border-radius:0 3px 3px 0}

.axis{display:grid; grid-template-columns:minmax(120px,212px) minmax(0,1fr) 108px; gap:11px; margin-top:9px}
.axis .scale{display:flex; justify-content:space-between; font-family:var(--f-mono);
  font-size:10px; color:var(--ink-3); grid-column:2}
.axis .scaleline{grid-column:2; position:relative; height:1px; background:var(--line-soft); margin-bottom:5px}

@media (max-width:640px){
  .pacerow{grid-template-columns:minmax(0,1fr) auto; gap:3px 8px; padding:5px 0;
    border-bottom:1px solid var(--line-soft)}
  .pacerow .who{grid-column:1; grid-row:1}
  .pacerow .amt{grid-column:2; grid-row:1}
  .pacerow .chartwrap-cell{grid-column:1 / -1; grid-row:2}
  .axis{grid-template-columns:1fr}
  .axis .scale,.axis .scaleline{grid-column:1}
}

.tip{position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-118%);
  background:var(--ink); color:var(--ink-inv); font-size:11.5px; padding:7px 9px;
  border-radius:7px; white-space:nowrap; transition:opacity .12s; z-index:20;
  box-shadow:var(--shadow); line-height:1.45}
.tip b{font-weight:600}

/* ---------- month heatmap ---------- */
.heat{display:flex; flex-direction:column; gap:3px}
.heatrow{display:grid; grid-template-columns:minmax(110px,190px) repeat(12,minmax(0,1fr)) 88px;
  gap:2px; align-items:center}
.heatrow .hname{font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding-right:6px}
.heatrow .hm{font-family:var(--f-mono); font-size:9px; color:var(--ink-3); text-align:center}
.heatrow .htot{font-family:var(--f-mono); font-size:11px; text-align:right; color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.cell{height:19px; border-radius:2px; background:var(--sunk)}
.cell.now{box-shadow:inset 0 0 0 1.5px var(--marine)}
.cell.neg{background:var(--behind-wash); box-shadow:inset 0 0 0 1px var(--behind)}
@media (max-width:780px){
  .heatrow{grid-template-columns:minmax(76px,1fr) repeat(12,minmax(0,1fr))}
  .heatrow .htot{display:none}
}

/* ---------- rows / lists ---------- */
.rows{display:flex; flex-direction:column}
.row{display:flex; gap:11px; align-items:flex-start; padding:11px 0;
  border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .rail{width:3px; border-radius:999px; align-self:stretch; flex-shrink:0; background:transparent}
.row.attention .rail{background:var(--behind)}
.row.waiting-rail .rail{background:var(--waiting)}
.row .rbody{flex:1; min-width:0}
.row .rtitle{font-size:13.5px; font-weight:600; overflow-wrap:anywhere}
.row .rmeta{font-size:11.5px; color:var(--ink-3); margin-top:3px; overflow-wrap:anywhere}
.row .ract{flex-shrink:0}

.grouphead{display:flex; align-items:center; gap:9px; margin:16px 0 3px;
  font-family:var(--f-mono); font-size:10px; font-weight:500; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3)}
.grouphead::after{content:""; flex:1; height:1px; background:var(--line-soft)}
.grouphead:first-child{margin-top:0}

.scroller{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13px}
th{font-family:var(--f-mono); font-size:9.5px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); text-align:left;
  padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:8px 9px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.attention td:first-child{box-shadow:inset 3px 0 0 var(--behind)}
td.n{font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap}
td input{padding:5px 7px; font-size:12.5px}
.empty{padding:22px 14px; text-align:center; color:var(--ink-3); font-size:13px}

/* ---------- event blocks ---------- */
.ev{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.ev.soon{border-color:color-mix(in srgb, var(--waiting) 45%, var(--line))}
.ev.past{opacity:.7}
.ev > header{padding:13px 15px; border-bottom:1px solid var(--line-soft);
  display:flex; gap:9px 11px; align-items:flex-start; flex-wrap:wrap}
.ev h3{font-size:14.5px; flex:1 1 190px; min-width:0; overflow-wrap:anywhere}
.ev .when{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-2)}
.ev .speaker{font-size:11.5px; color:var(--ink-3); flex-basis:100%}
.ev .rawnote{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); flex-basis:100%;
  overflow-wrap:anywhere}
.ready{display:flex; flex-direction:column}
.ready .item{display:grid; grid-template-columns:1fr 152px; gap:9px 13px; align-items:center;
  padding:10px 15px; border-bottom:1px solid var(--line-soft)}
.ready .item:last-child{border-bottom:none}
.ready .item .nm{font-size:13px; font-weight:500}
.ready .item .note{font-size:11px; color:var(--ink-3); margin-top:2px; line-height:1.4;
  grid-column:1; overflow-wrap:anywhere}
.ready .item select{font-size:12.5px; padding:6px 8px}
.ready .item .selwrap{grid-column:2; grid-row:1 / span 2; align-self:center}
@media (max-width:560px){
  .ready .item{grid-template-columns:1fr}
  .ready .item .selwrap{grid-column:1; grid-row:auto}
}
.ev > footer{padding:10px 15px; background:var(--surface-2); border-top:1px solid var(--line-soft);
  display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end}

/* ---------- checklist ---------- */
.meter{height:6px; border-radius:999px; background:var(--sunk); overflow:hidden; display:flex}
.meter i{display:block; height:100%}
.meter i.b{background:var(--marine)}
.meter i.p{background:var(--partner)}
.meter i.s{background:var(--speaker)}

.cl{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.cl > button.clhead{display:flex; width:100%; gap:11px; align-items:center; text-align:left;
  padding:12px 15px; background:none; border:none; cursor:pointer}
.cl h3{font-size:13.5px; flex:1 1 auto; min-width:0}
.cl .caret{color:var(--ink-3); flex-shrink:0; transition:transform .18s; display:inline-flex}
.cl .caret svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round}
.cl[data-open="true"] .caret{transform:rotate(180deg)}
.clbody{border-top:1px solid var(--line-soft); display:flex; flex-direction:column}
.cli{padding:11px 15px; border-bottom:1px solid var(--line-soft)}
.cli:last-child{border-bottom:none}
.cli .cltop{display:flex; gap:9px; align-items:flex-start; flex-wrap:wrap}
.cli .cllab{font-size:13px; font-weight:500; flex:1 1 200px; min-width:0; overflow-wrap:anywhere}
.cli .clhint{font-size:11px; color:var(--ink-3); line-height:1.45; margin-top:4px;
  overflow-wrap:anywhere}
.cli .clfield{margin-top:8px}
.cli.done{background:var(--surface-2)}
.cli .subs{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:9px}
.cli .subs label{display:inline-flex; align-items:center; gap:6px; font-size:12px;
  color:var(--ink-2); cursor:pointer}
.cli .qtyrow{display:grid; grid-template-columns:120px minmax(0,1fr); gap:9px; margin-top:8px}
@media (max-width:520px){.cli .qtyrow{grid-template-columns:1fr}}
.cli .tick{display:inline-flex; align-items:center; gap:8px; font-size:13px; cursor:pointer}

.tagpool{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.tagbtn{padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); font-size:12px; cursor:pointer; color:var(--ink-2)}
.tagbtn[aria-pressed="true"]{background:var(--marine-wash); border-color:var(--marine-line);

.tagbtn:disabled{opacity:.4; cursor:not-allowed}

.tt{display:flex; flex-direction:column; gap:6px; margin-top:9px}
.ttrow{display:grid; grid-template-columns:104px minmax(0,1fr); gap:9px; align-items:center}
.ttrow .tmark{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3)}
.ttrow .tbreak{font-size:12px; color:var(--ink-3); font-style:italic}

.spk{border:1px solid var(--line); border-radius:9px; padding:12px; margin-top:9px;
  background:var(--surface-2)}
.spk h4{font-size:12.5px; margin-bottom:9px; display:flex; align-items:center; gap:8px}
.spk h4 .grow{flex:1}

.report{font-family:var(--f-mono); font-size:12.5px; line-height:1.65; white-space:pre-wrap;
  overflow-wrap:anywhere; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:10px; padding:16px; margin:0}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px);
  background:var(--ink); color:var(--ink-inv); font-size:12.5px; padding:9px 14px;
  border-radius:999px; box-shadow:var(--shadow); opacity:0; pointer-events:none;
  transition:opacity .18s, transform .18s; z-index:60; max-width:calc(100vw - 32px); text-align:center}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

.foot{margin-top:26px; padding-top:14px; border-top:1px solid var(--line);

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

  if (rerender !== false) render();
  if (!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    dbRef.set(JSON.parse(JSON.stringify(S))).catch(err => {
      const code = err && err.code;
      if (code === "revoked" || code === "not_granted") {
        dbRef = null; storeMode = "local"; renderStorePill();
        toast("Shared store is no longer available — saving on this device only.");
      } else if (code === "quota_exceeded") {
        toast("The shared store is full. Clear old entries and try again.");
      } else {
        toast("Could not save to the shared store. Kept on this device.");
      }
    });
  }, 400);
}

/* =====================================================================
   5. DERIVED NUMBERS
   ===================================================================== */

const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const eur = n => "€" + Math.round(n).toLocaleString("en-US");
const eur0 = n => Math.round(n).toLocaleString("en-US");
const pct = (part, whole) => whole > 0 ? Math.round(Math.abs(part) / whole * 100) : 0;
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const MON3 = ["J","F","M","A","M","J","J","A","S","O","N","D"];

function fullName(d){
  const nm = d.distributor && String(d.distributor).trim()
    ? d.distributor + (d.uncertain ? "?" : "")
    : "(distributor not named in the sheet)";
  return d.country + " — " + nm;
}
const isDormant = d => num(d.q3) === 0 && num(d.booked) === 0;

function paced(){
  return S.distributors.map(d => {
    const q3 = num(d.q3), booked = num(d.booked);
    const gap = q3 - booked;
    return { ...d, q3, booked, gap, surplus: -gap, pct: pct(gap, q3),
             dormant: isDormant(d), label: fullName(d) };
  });
}
const byCountry = (a, b) =>
  String(a.country||"").localeCompare(String(b.country||""), "en", { sensitivity:"base" });

const activeRows    = () => paced().filter(d => !d.dormant).sort(byCountry);
const dormantRows   = () => paced().filter(d =>  d.dormant).sort(byCountry);
const attentionRows = () => paced().filter(d => !d.dormant && d.gap > 0).sort((a,b) => b.gap - a.gap);

function openApprovals(){
  return S.approvals.filter(a => !a.done)
    .map(a => ({ ...a, days: daysBetween(a.received, todayISO()) }))
    .sort((a, b) => b.days - a.days);
}
function daysBetween(fromISO, toISO){
  const a = Date.parse(fromISO + "T00:00:00"), b = Date.parse(toISO + "T00:00:00");
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.max(0, Math.round((b - a) / 86400000));
}
function daysAway(iso){
  const a = Date.parse(todayISO() + "T00:00:00"), b = Date.parse(iso + "T00:00:00");
  if (!Number.isFinite(b)) return null;
  return Math.round((b - a) / 86400000);
}
const sortedEvents   = () => S.events.slice()
  .sort((a, b) => String(a.date||"").localeCompare(String(b.date||"")));
const upcomingEvents = () => sortedEvents().filter(e => { const a = daysAway(e.date); return a !== null && a >= 0; });
const pastEvents     = () => sortedEvents().filter(e => { const a = daysAway(e.date); return a !== null && a <  0; });

function eventOpenCount(){
  let n = 0;
  upcomingEvents().forEach(e => READY_ITEMS.forEach(it => {
    if (((e.status || {})[it.key] || "no_update") !== "done") n++;
  }));
  return n;
}
const eventTitle = e =>
  (e.distributor ? e.country + " — " + e.distributor : e.country) + " · " + e.name;

const fmtDate = iso => {
  const t = Date.parse(iso + "T00:00:00");
  if (!Number.isFinite(t)) return iso || "—";
  return new Date(t).toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
};
const fmtDateShort = iso => {
  const t = Date.parse(iso + "T00:00:00");
  if (!Number.isFinite(t)) return iso || "—";
  return new Date(t).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
};
function awayText(iso, dayKnown){
  const a = daysAway(iso);
  if (a === null) return "date not set";
  const base = a === 0 ? "today"
    : a > 0 ? a + (a === 1 ? " day away" : " days away")
    : Math.abs(a) + (Math.abs(a) === 1 ? " day ago" : " days ago");
  return dayKnown === false ? base + ", day not given in the sheet" : base;
}

/* ---------- checklist progress ---------- */

function clFor(eventId){
  if (!S.checklists[eventId]) S.checklists[eventId] = { values:{}, tags:[], tt:{}, speakers:[] };
  const c = S.checklists[eventId];
  if (!c.values) c.values = {};
  if (!c.tags) c.tags = [];
  if (!c.tt) c.tt = {};
  if (!c.speakers) c.speakers = [];
  return c;
}
function itemAnswered(item, c){
  const v = c.values[item.id];
  switch (item.type) {
    case "fixed":     return true;
    case "check":
    case "checkqty":  return v === true;
    case "checkset":  return Array.isArray(v) && v.length > 0;
    case "tags":      return c.tags.length > 0;
    case "timetable": return TIMETABLE.filter(r => r.kind === "slot")
                        .every(r => String(c.tt[r.key] || "").trim() !== "");
    case "speakers":  return c.speakers.length > 0 &&
                        c.speakers.every(s => String(s.title||"").trim() && String(s.name||"").trim());
    default:          return typeof v === "string" && v.trim() !== "";
  }
}
const REQUIRED = [];
CHECKLIST.forEach(sec => sec.items.forEach(it => { if (it.required) REQUIRED.push(it); }));

function clProgress(eventId){
  const c = clFor(eventId);
  const byOwner = { partner:[0,0], speaker:[0,0], botiss:[0,0] };
  let done = 0;
  REQUIRED.forEach(it => {
    const o = byOwner[it.owner] || byOwner.botiss;
    o[1]++;
    if (itemAnswered(it, c)) { o[0]++; done++; }
  });
  return { done, total:REQUIRED.length, byOwner,
           pct: REQUIRED.length ? Math.round(done / REQUIRED.length * 100) : 0 };
}
function openFieldsFor(eventId, owner){
  const c = clFor(eventId), out = [];
  CHECKLIST.forEach(sec => sec.items.forEach(it => {
    if (it.owner !== owner || it.type === "fixed") return;
    if (itemAnswered(it, c)) return;
    out.push({ sec:sec.title, item:it });
  }));
  return out;
}

/* =====================================================================
   6. THE REPORT — the fixed shape, from the same numbers as the board.
   ===================================================================== */

function buildReport(){
  const L = [];
  const Q = S.quarter || "Q3";
  L.push("DAILY STATUS — " + fmtDate(todayISO()), "");

  const act = activeRows(), dor = dormantRows();
  L.push("DISTRIBUTOR TARGETS (" + Q + " pace) — sorted by country, A→Z");
  if (!act.length) L.push("- no distributor export loaded yet");
  else act.forEach(d => {
    const dir = d.gap > 0 ? "BEHIND" : d.gap < 0 ? "AHEAD" : "ON PACE";
    const tail = d.gap === 0 ? "on pace" : eur(Math.abs(d.gap)) + " " + dir + " (" + d.pct + "%)";
    L.push("- " + d.label + "  " + Q + " target: " + eur(d.q3) +
           " | booked: " + eur(d.booked) + " | " + tail);
  });
  L.push("");

  L.push("NEEDS ATTENTION (largest shortfalls vs. " + Q + " pace)");
  const att = attentionRows();
  if (!att.length) L.push("- none behind pace");
  else att.forEach(d => L.push("- " + d.label + ": " + eur(d.gap) + " behind (" + d.pct + "%)"));
  L.push("");

  L.push("NO ACTIVE TARGET THIS YEAR");
  if (!dor.length) L.push("- none");
  else dor.forEach(d => L.push("- " + d.label));
  L.push("");

  L.push("PENDING ORDER APPROVALS");
  const open = openApprovals();
  const reviewed = S.approvalsCheckedOn === todayISO();
  if (!open.length) {
    L.push(reviewed ? "- none open — today's email input reviewed"
                    : "(needs today's email input — no data given yet)");
  } else {
    open.forEach(a => L.push("- " + a.ref + " — waiting " + a.days +
      (a.days === 1 ? " day" : " days") + (a.note ? " · " + a.note : "")));
    if (!reviewed) L.push("(today's email input not given yet — this list may be incomplete)");
  }
  L.push("");

  L.push("EVENT READINESS — sorted by date, soonest first");
  const evs = upcomingEvents();
  if (!evs.length) L.push("- no upcoming events");
  else evs.forEach((e, i) => {
    L.push(eventTitle(e) + " — " + fmtDate(e.date) + " (" + awayText(e.date, e.dayKnown) +
           ") — Speaker: " + (e.speaker ? e.speaker : "no update yet"));
    READY_ITEMS.forEach(it =>
      L.push("- " + it.name + ": " + statusLabel((e.status || {})[it.key] || "no_update")));
    if (S.checklists[e.id]) {
      const p = clProgress(e.id);
      if (p.done) L.push("  checklist: " + p.done + " of " + p.total + " required fields in");
    }
    if (brandSlip(e.name)) L.push("  ! event brand reads “DAY” — must read “" + BRAND + "”");
    if (e.flag) L.push("  ! " + e.flag);
    if (i < evs.length - 1) L.push("");
  });
  return L.join("\n");
}

function buildChaseNote(eventId, owner){
  const e = S.events.find(x => x.id === eventId);
  const fields = openFieldsFor(eventId, owner);
  const L = [BRAND + " — " + eventTitle(e),
             fmtDate(e.date) + " (" + awayText(e.date, e.dayKnown) + ")", ""];
  if (!fields.length) {
    L.push("Everything on the " + OWNERS[owner].toLowerCase() + " side is in. Nothing outstanding.");
    return L.join("\n");
  }
  L.push("Still open on the " + OWNERS[owner].toLowerCase() + " side — " + fields.length +
         (fields.length === 1 ? " item:" : " items:"));
  let sec = "";
  fields.forEach(f => {
    if (f.sec !== sec) { sec = f.sec; L.push("", sec.toUpperCase()); }
    L.push("- " + f.item.label);
    if (f.item.hint) L.push("    " + f.item.hint);
  });
  return L.join("\n");
}

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

const ICON = {
  warn:'<svg viewBox="0 0 24 24"><path d="M12 9v4m0 3h.01M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M4 20h16"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.5 9 17.5 20 6.5"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 20V9m0 0 4 4m-4-4-8 4M12 9 4 13"/></svg>',
  caret:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
};

const TABS = [
  { key:"targets",   label:"Targets" },
  { key:"approvals", label:"Approvals" },
  { key:"events",    label:"Events" },
  { key:"checklist", label:"Checklist" },
  { key:"report",    label:"Report" }
];

function renderTabs(){
  const counts = {
    targets:[attentionRows().length,"hot"],
    approvals:[openApprovals().length,"warm"],
    events:[eventOpenCount(),"warm"],
    checklist:[null,""],
    report:[null,""]
  };
  document.getElementById("tabs").innerHTML = TABS.map(t => {
    const c = counts[t.key];
    const badge = c[0] ? '<span class="count ' + c[1] + '">' + c[0] + "</span>" : "";
    return '<button class="tab" role="tab" id="tab-' + t.key + '" data-tab="' + t.key +
      '" aria-selected="' + (tab === t.key) + '">' + t.label + badge + "</button>";
  }).join("");
}

function renderStorePill(){
  const el = document.getElementById("storePill");
  if (storeMode === "shared") {
    el.className = "pill shared";
    el.innerHTML = '<span class="led"></span>Shared — everyone with the link sees this';
  } else {
    el.className = "pill local";
    el.innerHTML = '<span class="led"></span>This device only';
  }
}

function render(){
  renderTabs();
  const v = document.getElementById("view");
  document.getElementById("todayStamp").textContent =
    fmtDateShort(todayISO()) + " · " + (S.quarter || "Q3");
  if (tab === "targets")   v.innerHTML = viewTargets();
  if (tab === "approvals") v.innerHTML = viewApprovals();
  if (tab === "events")    v.innerHTML = viewEvents();
  if (tab === "checklist") v.innerHTML = viewChecklist();
  if (tab === "report")    v.innerHTML = viewReport();
  if (tab === "targets")   { wireTips("paceTip", ".pacerow", "tip"); wireTips("heatTip", ".cell", "heat"); }
}

/* ---------- Targets ---------- */

function viewTargets(){
  const act = activeRows(), dor = dormantRows(), att = attentionRows();
  const totQ3 = act.reduce((s, d) => s + d.q3, 0);
  const totBooked = act.reduce((s, d) => s + d.booked, 0);
  const totTarget = act.reduce((s, d) => s + num(d.target), 0);
  const net = totQ3 - totBooked;
  const budget = S.distributors.reduce((s, d) => s + num(d.budget), 0);

  const figs =
    '<div class="figs">' +
      '<div class="fig"><div class="v num">' + eur(totQ3) + '</div>' +
        '<div class="k">' + esc(S.quarter) + ' target, active distributors</div>' +
        '<div class="s">' + act.length + ' of ' + S.distributors.length + ' carry a target</div></div>' +
      '<div class="fig"><div class="v num">' + eur(totBooked) + '</div>' +
        '<div class="k">Booked year to date</div>' +
        '<div class="s">' + pct(totBooked, totTarget) + '% of the ' + eur(totTarget) + ' full year</div></div>' +
      '<div class="fig ' + (net > 0 ? "behind" : net < 0 ? "ahead" : "") + '">' +
        '<div class="v num">' + (net === 0 ? "level" : eur(Math.abs(net))) + '</div>' +
        '<div class="k">' + (net > 0 ? "Behind pace, net" : net < 0 ? "Ahead of pace, net" : "On pace") + '</div>' +
        '<div class="s">' + pct(net, totQ3) + '% of the ' + esc(S.quarter) + ' target</div></div>' +
      '<div class="fig ' + (att.length ? "behind" : "ahead") + '">' +
        '<div class="v num">' + att.length + ' of ' + act.length + '</div>' +
        '<div class="k">Behind ' + esc(S.quarter) + ' pace</div>' +
        '<div class="s">' + dor.length + ' with no active target</div></div>' +
      '<div class="fig"><div class="v num">' + eur(budget) + '</div>' +
        '<div class="k">Event budget, 5% of target</div>' +
        '<div class="s">across all distributors</div></div>' +
    "</div>";

  return '<div class="stack">' +
    sourceNote() + figs + paceChart(act) + attentionList(att) +
    monthHeat() + targetTable(act, dor) + planNote() + importPanel() +
  "</div>";
}

function sourceNote(){
  return '<div class="notice info">' + ICON.info + '<div class="nbody">' +
    '<strong>Live from 2026_plan.xlsx</strong> — the “revenues” and “events” sheets, loaded ' +
    esc(fmtDateShort(S.asOf)) + '. ' + esc(S.quarter) + ' target is the sheet’s own column ' +
    '(full-year target ÷ 4 × 3); booked is its “2026” column, which already sums the monthly ' +
    'cells including September. Nothing here is recomputed differently from the sheet.' +
    "</div></div>";
}

function planNote(){
  /* The workbook carries two target sets and they disagree. Say so rather than pick one. */
  const diff = S.distributors.filter(d => num(d.plan26) > 0 &&
    Math.abs(num(d.plan26) - num(d.target)) / num(d.plan26) > 0.05);
  if (!diff.length) return "";
  return '<div class="notice">' + ICON.warn + '<div class="nbody">' +
    '<strong>Two target sets in the workbook disagree.</strong> The “2026 target” column that drives ' +
    esc(S.quarter) + ' pace is last year × 1.05 for every distributor except Jordan, which is set to ' +
    'its agreed plan instead. The table lower down the sheet holds the agreed 2026/2027 plan, and for ' +
    diff.length + ' distributors the two differ by more than 5%: ' +
    diff.map(d => esc(d.country) + " " + eur(num(d.target)) + " vs plan " + eur(num(d.plan26))).join(" · ") +
    '. The board follows the pace column, as the check-in does. Both are in the table above.' +
    "</div></div>";
}

function paceChart(rows){
  if (!rows.length) return "";
  const sorted = rows.slice().sort((a, b) => a.surplus - b.surplus);
  const maxAbs = Math.max.apply(null, sorted.map(d => Math.abs(d.surplus)).concat([1]));
  const bars = sorted.map(d => {
    const w = Math.abs(d.surplus) / maxAbs * 50;
    const side = d.surplus < 0 ? "behind" : "ahead";
    const bar = d.surplus === 0 ? "" :
      '<div class="bar ' + side + '" style="width:' + w.toFixed(2) + '%"></div>';
    const amt = d.surplus === 0 ? "on pace"
      : (d.surplus < 0 ? "−" : "+") + eur(Math.abs(d.surplus));
    const tipTxt = d.label + "|" + S.quarter + " target " + eur(d.q3) + " · booked " + eur(d.booked) +
      "|" + (d.gap > 0 ? eur(d.gap) + " behind (" + d.pct + "%)"
           : d.gap < 0 ? eur(-d.gap) + " ahead (" + d.pct + "%)" : "level with target");
    return '<div class="pacerow" data-tip="' + esc(tipTxt) + '">' +
      '<div class="who"><b>' + esc(d.country) + '</b> — ' +
        esc(d.distributor || "not named") + "</div>" +
      '<div class="chartwrap-cell"><div class="track"><div class="zero"></div>' + bar + "</div></div>" +
      '<div class="amt ' + (d.surplus < 0 ? "behind" : d.surplus > 0 ? "ahead" : "") +
        ' num">' + amt + "</div>" +
    "</div>";
  }).join("");

  return '<section class="sect"><div class="sect-head">' +
    "<h2>Pace against the " + esc(S.quarter) + " target</h2>" +
    '<span class="hint">Booked minus target · worst at the top</span></div>' +
    '<div class="legend">' +
      '<span><i style="background:var(--behind)"></i>Behind pace</span>' +
      '<span><i style="background:var(--ahead)"></i>Ahead of pace</span>' +
      '<span><i style="background:var(--rule)"></i>Target</span>' +
    "</div>" +
    '<div class="chartwrap">' +
      '<div class="pace">' + bars + "</div>" +
      '<div class="axis"><div class="scaleline"></div><div class="scale">' +
        "<span>−" + eur(maxAbs) + "</span><span>0</span><span>+" + eur(maxAbs) + "</span>" +
      "</div></div>" +
      '<div class="tip" id="paceTip"></div>' +
    "</div></section>";
}

function monthHeat(){
  const rows = activeRows();
  if (!rows.length) return "";
  let max = 0;
  rows.forEach(d => MONTHS.forEach(m => {
    const v = num((d.months||{})[m]); if (v > max) max = v;
  }));
  if (max <= 0) max = 1;
  const nowMonth = new Date().getMonth();

  const head = '<div class="heatrow"><div class="hname label">Booked by month</div>' +
    MON3.map((m, i) => '<div class="hm"' +
      (i === nowMonth ? ' style="color:var(--marine);font-weight:500"' : "") + ">" + m + "</div>").join("") +
    '<div class="htot label">Year</div></div>';

  const body = rows.map(d => {
    const cells = MONTHS.map((m, i) => {
      const raw = (d.months||{})[m];
      const has = raw !== undefined && raw !== null;
      const v = num(raw);
      const cls = "cell" + (i === nowMonth ? " now" : "") + (has && v < 0 ? " neg" : "");
      /* Square-root shading: one very large month would otherwise flatten
         every other cell to the same near-empty tint. */
      const style = has && v >= 0
        ? "background:color-mix(in srgb, var(--heat) " +
          Math.max(16, Math.round(Math.sqrt(v / max) * 100)) + "%, var(--sunk))"
        : "";
      const tipTxt = d.label + "|" + m + "|" + (has ? eur(v) : "nothing booked");
      return '<div class="' + cls + '" style="' + style + '" data-heat="' + esc(tipTxt) + '"></div>';
    }).join("");
    return '<div class="heatrow"><div class="hname">' + esc(d.country) + " — " +
      esc(d.distributor || "not named") + "</div>" + cells +
      '<div class="htot">' + eur0(d.booked) + "</div></div>";
  }).join("");

  return '<section class="sect"><div class="sect-head">' +
    "<h2>Where the year has landed, month by month</h2>" +
    '<span class="hint">September is outlined — the month still in progress · shading is square-root scaled</span></div>' +
    '<div class="legend">' +
      '<span><i style="background:var(--sunk)"></i>nothing booked</span>' +
      '<span><i style="background:color-mix(in srgb, var(--heat) 45%, var(--sunk))"></i>smaller month</span>' +
      '<span><i style="background:var(--heat)"></i>biggest month, ' + eur(max) + '</span>' +
      '<span><i style="background:var(--behind-wash);box-shadow:inset 0 0 0 1px var(--behind)"></i>credit / negative</span>' +
    "</div>" +
    '<div class="chartwrap"><div class="heat">' + head + body + "</div>" +
      '<div class="tip" id="heatTip"></div>' +
    "</div></section>";
}

function wireTips(tipId, sel, dataKey){
  const tip = document.getElementById(tipId);
  if (!tip) return;
  const wrap = tip.parentElement;
  wrap.querySelectorAll(sel).forEach(node => {
    node.addEventListener("pointerenter", () => {
      const p = (node.dataset[dataKey] || "").split("|");
      tip.innerHTML = "<b>" + esc(p[0]) + "</b><br>" +
        (dataKey === "heat"
          ? esc(p[1]) + ": <span class='num'>" + esc(p[2]) + "</span>"
          : "<span class='num'>" + esc(p[1]) + "</span><br>" + esc(p[2]));
      const rr = node.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      tip.style.left = Math.round(rr.left - wr.left + rr.width / 2) + "px";
      tip.style.top  = Math.round(rr.top - wr.top) + "px";
      tip.style.opacity = "1";
    });
    node.addEventListener("pointerleave", () => { tip.style.opacity = "0"; });
  });
}

function attentionList(att){
  if (!att.length) {
    return '<section class="sect"><div class="sect-head"><h2>Needs attention</h2></div>' +
      '<div class="empty">Nobody is behind ' + esc(S.quarter) + ' pace.</div></section>';
  }
  return '<section class="sect"><div class="sect-head">' +
    "<h2>Needs attention</h2>" +
    '<span class="hint">Behind-pace only, ranked by euro shortfall</span></div>' +
    '<div class="rows">' + att.map(d =>
      '<div class="row attention"><div class="rail"></div><div class="rbody">' +
        '<div class="rtitle">' + esc(d.label) + "</div>" +
        '<div class="rmeta">' + esc(S.quarter) + " target " + eur(d.q3) + " · booked " + eur(d.booked) +
          " · full year " + eur(num(d.target)) + (d.terms ? " · " + esc(d.terms) : "") +
          (d.uncertain ? " · name unconfirmed in the sheet, carried over as written" : "") + "</div>" +
      "</div>" +
      '<div class="ract"><span class="chip behind">' + eur(d.gap) + " behind · " + d.pct + "%</span></div>" +
      "</div>").join("") +
    "</div></section>";
}

function targetTable(act, dor){
  const head = '<tr><th>Country</th><th>Distributor</th><th>Terms</th><th class="r">' +
    esc(S.quarter) + ' target</th><th class="r">Booked</th><th class="r">Pace</th>' +
    '<th class="r">2026 target</th><th class="r">2026 plan</th><th class="r">2027 plan</th>' +
    '<th class="r">5% events</th><th></th></tr>';

  const rowFor = d => {
    if (editRows) {
      const f = (k, lab) => '<input class="' + (["q3","booked","target","plan26","plan27"].includes(k) ? "money" : "") +
        '" aria-label="' + lab + '" data-edit="' + k + '" data-id="' + d.id + '" value="' +
        esc(["q3","booked","target","plan26","plan27"].includes(k) ? num(d[k]) : (d[k] || "")) + '">';
      return "<tr><td>" + f("country","Country") + "</td><td>" + f("distributor","Distributor") +
        "</td><td>" + f("terms","Terms") +
        '</td><td class="r">' + f("q3","Q3 target") +
        '</td><td class="r">' + f("booked","Booked") +
        '</td><td class="r n">—</td><td class="r">' + f("target","2026 target") +
        '</td><td class="r">' + f("plan26","2026 plan") +
        '</td><td class="r">' + f("plan27","2027 plan") +
        '</td><td class="r n">' + eur0(num(d.budget)) +
        '</td><td class="r"><button class="btn quiet" data-del-dist="' + d.id +
        '" aria-label="Remove ' + esc(d.label) + '">' + ICON.trash + "</button></td></tr>";
    }
    const chip = d.dormant ? '<span class="chip idle">no active target</span>'
      : d.gap > 0 ? '<span class="chip behind">' + eur(d.gap) + " behind · " + d.pct + "%</span>"
      : d.gap < 0 ? '<span class="chip ahead">' + eur(-d.gap) + " ahead · " + d.pct + "%</span>"
      : '<span class="chip">on pace</span>';
    const planOff = num(d.plan26) > 0 &&
      Math.abs(num(d.plan26) - num(d.target)) / num(d.plan26) > 0.05;
    return "<tr" + (d.gap > 0 && !d.dormant ? ' class="attention"' : "") + ">" +
      "<td>" + esc(d.country) + "</td>" +
      "<td>" + (d.distributor ? esc(d.distributor) : '<span class="mutedcell">not named</span>') +
        (d.uncertain ? ' <span class="chip idle" title="The sheet carries a “?” on this name; it is kept exactly as written">?</span>' : "") +
      "</td>" +
      "<td>" + (d.terms ? '<span class="chip terms">' + esc(d.terms) + "</span>" : "") + "</td>" +
      '<td class="r n">' + eur0(d.q3) + "</td>" +
      '<td class="r n">' + eur0(d.booked) + "</td>" +
      '<td class="r">' + chip + "</td>" +
      '<td class="r n">' + eur0(num(d.target)) + "</td>" +
      '<td class="r n"' + (planOff ? ' style="color:var(--waiting)" title="Differs from the pace column by more than 5%"' : "") +
        ">" + eur0(num(d.plan26)) + "</td>" +
      '<td class="r n">' + eur0(num(d.plan27)) + "</td>" +
      '<td class="r n">' + eur0(num(d.budget)) + "</td><td></td></tr>";
  };

  const body = !act.length && !dor.length
    ? '<tr><td colspan="11"><div class="empty">No distributors loaded.</div></td></tr>'
    : (act.length ? act.map(rowFor).join("") : "") +
      (dor.length
        ? '<tr><td colspan="11"><div class="grouphead">No active target this year</div></td></tr>' +
          dor.map(rowFor).join("")
        : "");

  return '<section class="sect"><div class="sect-head">' +
    "<h2>All distributors</h2>" +
    '<span class="hint">Alphabetical by country · dormant rows always at the bottom</span></div>' +
    '<div class="scroller"><table><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
    '<div class="btnrow" style="margin-top:12px">' +
      '<button class="btn sm" id="toggleEdit">' + (editRows ? "Done editing" : "Edit rows") + "</button>" +
      '<button class="btn sm" id="addDist">' + ICON.plus + "Add distributor</button>" +
      '<button class="btn sm" id="reseed">Reload the sheet as supplied</button>' +
    "</div></section>";
}

function importPanel(){
  if (mapper) return mapperPanel();
  const xlsxReady = typeof XLSX !== "undefined";
  return '<section class="sect"><div class="sect-head">' +
    "<h2>Load a newer export</h2>" +
    '<span class="hint">Replaces every distributor row</span></div>' +
    '<p style="font-size:12.5px;color:var(--ink-3);max-width:64ch">' +
      "Drop in next month’s 2026_plan.xlsx and the “revenues” sheet is recognised on its own — " +
      "the Country column, the “Q3 target” column and the bare-year booked column. Any other layout " +
      "falls back to picking the columns by hand.</p>" +
    '<div class="formgrid wide" style="margin-top:12px">' +
      (xlsxReady
        ? '<div><label class="fld" for="xlsFile">Excel or CSV export</label>' +
          '<input type="file" id="xlsFile" accept=".xlsx,.xlsm,.xls,.csv"></div>'
        : '<div><label class="fld">Excel export</label>' +
          '<div style="font-size:12px;color:var(--ink-3)">The spreadsheet reader did not load here. Paste the cells instead.</div></div>') +
      '<div><label class="fld" for="pasteBox">…or paste cells straight from Excel</label>' +
        '<textarea id="pasteBox" placeholder="Country&#9;2026 target&#9;2026&#9;…"></textarea>' +
        '<div class="btnrow" style="margin-top:8px"><button class="btn sm" id="pasteGo">' +
        ICON.up + "Read pasted cells</button></div></div>" +
    "</div>" +
    '<div style="margin-top:12px"><label class="fld" for="asOfIn">Export dated</label>' +
      '<input type="date" id="asOfIn" value="' + esc(S.asOf || todayISO()) +
      '" style="max-width:220px"></div>' +
    "</section>";
}

function mapperPanel(){
  const opts = i => mapper.headers.map((h, j) =>
    '<option value="' + j + '"' + (i === j ? " selected" : "") + ">" +
    esc(h || ("column " + (j + 1))) + "</option>").join("");
  return '<section class="sect"><div class="sect-head">' +
    "<h2>Which column is which?</h2>" +
    '<span class="hint">' + mapper.rows.length + " data rows found</span></div>" +
    '<div class="formgrid wide">' +
      '<div><label class="fld" for="mapCountry">Country / distributor label</label>' +
        '<select id="mapCountry">' + opts(mapper.guess.country) + "</select></div>" +
      '<div><label class="fld" for="mapTarget">' + esc(S.quarter) + ' target</label>' +
        '<select id="mapTarget">' + opts(mapper.guess.q3) + "</select></div>" +
      '<div><label class="fld" for="mapBooked">Booked year to date</label>' +
        '<select id="mapBooked">' + opts(mapper.guess.booked) + "</select></div>" +
      '<div><label class="fld" for="mapFull">Full-year target</label>' +
        '<select id="mapFull"><option value="-1">none</option>' + opts(mapper.guess.target) + "</select></div>" +
    "</div>" +
    '<div class="notice info" style="margin-top:12px">' + ICON.info +
      '<div class="nbody">Labels shaped “Country — Distributor 4+1” split into country, distributor and terms. ' +
      'A “?” is kept exactly as written and flagged as unconfirmed. Rows with a €0 target and €0 booked land ' +
      'in “no active target this year”.</div></div>' +
    '<div class="btnrow" style="margin-top:12px">' +
      '<button class="btn primary" id="mapGo">' + ICON.check + "Import " + mapper.rows.length + " rows</button>" +
      '<button class="btn" id="mapCancel">Cancel</button>' +
    "</div></section>";
}

/* ---------- Approvals ---------- */

function viewApprovals(){
  const open = openApprovals();
  const closed = S.approvals.filter(a => a.done);
  const reviewed = S.approvalsCheckedOn === todayISO();

  const state = reviewed
    ? '<div class="notice info">' + ICON.check + '<div class="nbody"><strong>Today’s email input is in.</strong> ' +
      "The list below is what is genuinely still waiting on your ok.</div></div>"
    : '<div class="notice">' + ICON.warn + '<div class="nbody"><strong>No order emails have been given for today.</strong> ' +
      "The workbook carries revenue and events, not the inbox — so this section starts empty and the report says " +
      "“needs today’s email input” rather than implying nothing is waiting." +
      '<div><button class="btn sm" id="markReviewed">' + ICON.check + "Inbox reviewed for today</button></div></div></div>";

  const list = open.length
    ? '<div class="rows">' + open.map(a =>
        '<div class="row ' + (a.days >= 3 ? "attention" : "waiting-rail") + '">' +
        '<div class="rail"></div><div class="rbody">' +
          '<div class="rtitle">' + esc(a.ref) + "</div>" +
          '<div class="rmeta">arrived ' + esc(fmtDateShort(a.received)) +
            (a.note ? " · " + esc(a.note) : "") + "</div>" +
        "</div>" +
        '<div class="ract chiprow">' +
          '<span class="chip ' + (a.days >= 3 ? "behind" : "waiting") + '">waiting ' + a.days +
            (a.days === 1 ? " day" : " days") + "</span>" +
          '<button class="btn sm" data-ok="' + a.id + '">' + ICON.check + "Ok sent</button>" +
          '<button class="btn quiet" data-del-appr="' + a.id + '" aria-label="Remove ' + esc(a.ref) + '">' +
            ICON.trash + "</button>" +
        "</div></div>").join("") + "</div>"
    : '<div class="empty">Nothing logged as waiting on an ok.</div>';

  const add = '<section class="sect"><div class="sect-head"><h2>Log an order that arrived by email</h2></div>' +
    '<div class="formgrid wide">' +
      '<div><label class="fld" for="apprRef">Order reference and customer</label>' +
        '<input id="apprRef" placeholder="PO-4491 — Khoury Dental"></div>' +
      '<div><label class="fld" for="apprDate">Arrived on</label>' +
        '<input type="date" id="apprDate" value="' + todayISO() + '"></div>' +
      '<div style="grid-column:1/-1"><label class="fld" for="apprNote">What it needs</label>' +
        '<input id="apprNote" placeholder="cerabone 1.0 cc ×40 — ok to customer service"></div>' +
    "</div>" +
    '<div class="btnrow" style="margin-top:11px"><button class="btn primary" id="apprAdd">' +
      ICON.plus + "Add to the waiting list</button></div>" +
    "</section>";

  const cleared = closed.length
    ? '<section class="sect"><div class="sect-head"><h2>Ok sent</h2>' +
      '<span class="hint">' + closed.length + " total</span></div>" +
      '<div class="rows">' + closed.slice(-8).reverse().map(a =>
        '<div class="row"><div class="rail"></div><div class="rbody">' +
          '<div class="rtitle" style="font-weight:500;color:var(--ink-2)">' + esc(a.ref) + "</div>" +
          '<div class="rmeta">ok sent ' + esc(fmtDateShort(a.doneOn || todayISO())) + "</div></div>" +
        '<div class="ract"><button class="btn quiet" data-reopen="' + a.id + '">Reopen</button></div></div>').join("") +
      "</div></section>"
    : "";

  return '<div class="stack">' + state +
    '<section class="sect"><div class="sect-head"><h2>Waiting on your ok to customer service</h2>' +
      '<span class="hint">Longest wait first</span></div>' + list + "</section>" +
    add + cleared + "</div>";
}

/* ---------- Events ---------- */

function eventBudgetFor(e){
  const d = S.distributors.find(x => x.country === e.country &&
    (!e.distributor || x.distributor === e.distributor));
  return d ? num(d.budget) : 0;
}

function eventBlock(e, isPast){
  const away = daysAway(e.date);
  const soon = !isPast && away !== null && away <= 21;
  const open = READY_ITEMS.filter(it => ((e.status || {})[it.key] || "no_update") !== "done").length;
  const budget = eventBudgetFor(e);
  const prog = S.checklists[e.id] ? clProgress(e.id) : null;

  const slip = brandSlip(e.name)
    ? '<div class="notice bad" style="margin:0 15px 13px">' + ICON.warn +
      '<div class="nbody"><strong>The event brand reads “DAY”.</strong> It must read “' + esc(BRAND) + '”.' +
      '<div><button class="btn sm" data-fixbrand="' + e.id + '">Fix to “DAYS”</button></div></div></div>'
    : "";
  const flag = e.flag
    ? '<div class="notice" style="margin:0 15px 13px">' + ICON.warn +
      '<div class="nbody">' + esc(e.flag) + "</div></div>"
    : "";

  const items = READY_ITEMS.map(it => {
    const st = (e.status || {})[it.key] || "no_update";
    return '<div class="item"><div><div class="nm">' + esc(it.name) + "</div>" +
      '<div class="note">' + esc(it.note) + "</div></div>" +
      '<div class="selwrap"><select id="st-' + e.id + "-" + it.key +
        '" aria-label="' + esc(it.name) + '" data-ev="' + e.id + '" data-item="' + it.key + '">' +
      STATUSES.map(s => '<option value="' + s.key + '"' + (s.key === st ? " selected" : "") + ">" +
        s.label + "</option>").join("") + "</select></div></div>";
  }).join("");

  return '<section class="ev' + (soon ? " soon" : "") + (isPast ? " past" : "") + '"><header>' +
    "<h3>" + esc(eventTitle(e)) + "</h3>" +
    '<span class="when">' + esc(fmtDateShort(e.date)) + " · " + esc(awayText(e.date, e.dayKnown)) + "</span>" +
    '<span class="chip ' + (open === 0 ? "done" : open >= 4 ? "behind" : "waiting") + '">' +
      (open === 0 ? "all five ready" : open + " of 5 open") + "</span>" +
    (e.kind ? '<span class="chip ' + (e.kind === "BRD" ? "marine" : "idle") + '">' + esc(e.kind) + "</span>" : "") +
    '<div class="speaker">Speaker: ' + (e.speaker ? esc(e.speaker) : "no update yet") +
      (budget ? " · event budget " + eur(budget) + " (5% of target)" : "") +
      (prog ? " · checklist " + prog.done + "/" + prog.total : "") + "</div>" +
    (e.rawNote ? '<div class="rawnote">sheet cell' + (e.month ? " (" + esc(e.month) + ")" : "") +
      ": “" + esc(e.rawNote) + "”</div>" : "") +
    "</header>" + slip + flag +
    '<div class="ready">' + items + "</div>" +
    "<footer>" +
      '<div style="flex:1 1 160px;min-width:0"><label class="fld" for="ev-name-' + e.id + '">Event name</label>' +
        '<input id="ev-name-' + e.id + '" data-evfield="name" data-ev="' + e.id + '" value="' + esc(e.name) + '"></div>' +
      '<div style="flex:0 1 150px"><label class="fld" for="ev-date-' + e.id + '">Date</label>' +
        '<input type="date" id="ev-date-' + e.id + '" data-evfield="date" data-ev="' + e.id + '" value="' + esc(e.date) + '"></div>' +
      '<div style="flex:1 1 160px;min-width:0"><label class="fld" for="ev-sp-' + e.id + '">Speaker / KOL</label>' +
        '<input id="ev-sp-' + e.id + '" data-evfield="speaker" data-ev="' + e.id + '" value="' + esc(e.speaker || "") +
        '" placeholder="empty reads “no update yet”"></div>' +
      '<button class="btn sm" data-opench="' + e.id + '">Open checklist</button>' +
      '<button class="btn quiet" data-del-ev="' + e.id + '" aria-label="Remove ' + esc(eventTitle(e)) + '">' +
        ICON.trash + "Remove</button>" +
    "</footer></section>";
}

function vipBlock(){
  const v = S.vip;
  if (!v) return "";
  const off = v.roomsAllocated !== v.roomsBooked;
  return '<section class="sect"><div class="sect-head">' +
    "<h2>September VIP event</h2>" +
    '<span class="hint">events sheet, September total row</span></div>' +
    '<div class="rawnote" style="font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-bottom:11px">' +
      'sheet cell: “' + esc(v.rawNote) + '”</div>' +
    (off ? '<div class="notice">' + ICON.warn + '<div class="nbody"><strong>' + v.roomsAllocated +
      " rooms are allocated against " + v.roomsBooked + " booked.</strong> The per-country split in the " +
      "sheet adds up to " + v.roomsAllocated + ". Confirm the room count before the guest list goes out." +
      "</div></div>" : "") +
    '<div class="scroller" style="margin-top:11px"><table><thead><tr><th>Country</th>' +
      '<th>Sheet label</th><th class="r">Rooms</th></tr></thead><tbody>' +
      v.rooms.map(r => "<tr><td>" + esc(r.country) + '</td><td class="mutedcell">' + esc(r.label) +
        '</td><td class="r n">' + r.n + "</td></tr>").join("") +
      '<tr><td colspan="2"><strong>Allocated</strong></td><td class="r n"><strong>' +
        v.roomsAllocated + "</strong></td></tr>" +
      '<tr><td colspan="2">Booked per the sheet</td><td class="r n">' + v.roomsBooked + "</td></tr>" +
    "</tbody></table></div></section>";
}

function viewEvents(){
  const up = upcomingEvents(), past = pastEvents();
  const blocks = up.length
    ? up.map(e => eventBlock(e, false)).join("")
    : '<div class="sect"><div class="empty">No upcoming events.</div></div>';

  const add = '<section class="sect"><div class="sect-head"><h2>Add an event</h2>' +
    '<span class="hint">All five readiness lines start at “no update yet”</span></div>' +
    '<div class="formgrid wide">' +
      '<div><label class="fld" for="evCountry">Country</label><input id="evCountry" placeholder="Kuwait"></div>' +
      '<div><label class="fld" for="evDist">Distributor</label><input id="evDist" placeholder="RoyalPedia"></div>' +
      '<div><label class="fld" for="evName">Event</label><input id="evName" placeholder="BRD"></div>' +
      '<div><label class="fld" for="evDate">Date</label><input type="date" id="evDate" value="' + todayISO() + '"></div>' +
      '<div><label class="fld" for="evSpeaker">Speaker / KOL</label><input id="evSpeaker" placeholder="optional"></div>' +
    "</div>" +
    '<div class="btnrow" style="margin-top:11px"><button class="btn primary" id="evAdd">' +
      ICON.plus + "Add event</button></div></section>";

  const pastPart = past.length
    ? '<div class="grouphead">Already happened this year (' + past.length + ")</div>" +
      '<div class="btnrow"><button class="btn sm" id="togglePast">' +
        (S.showPast ? "Hide" : "Show") + " past events</button></div>" +
      (S.showPast ? past.map(e => eventBlock(e, true)).join("") : "")
    : "";

  return '<div class="stack">' + blocks + vipBlock() + add +
    (pastPart ? pastPart : "") + "</div>";
}

/* ---------- Checklist ---------- */

function viewChecklist(){
  const evs = upcomingEvents();
  if (!evs.length) {
    return '<div class="sect"><div class="empty">No upcoming events to run a checklist for.</div></div>';
  }
  if (!clEvent || !evs.some(e => e.id === clEvent)) {
    const brd = evs.find(e => e.kind === "BRD");
    clEvent = (brd || evs[0]).id;
  }
  const e = S.events.find(x => x.id === clEvent);
  const c = clFor(clEvent);
  const p = clProgress(clEvent);
  const w = o => p.total ? (p.byOwner[o][0] / p.total * 100) : 0;

  const picker = '<section class="sect"><div class="sect-head">' +
    '<div><div class="eyebrow">' + esc(BRAND) + "</div>" +
    '<h2 style="font-size:18px;margin-top:4px">Event checklist</h2></div>' +
    '<span class="hint">Every field from the BRD event checklist</span></div>' +
    '<div><label class="fld" for="clPick">Which event</label><select id="clPick">' +
      evs.map(x => '<option value="' + x.id + '"' + (x.id === clEvent ? " selected" : "") + ">" +
        esc(eventTitle(x)) + " — " + esc(fmtDateShort(x.date)) +
        " (" + esc(awayText(x.date, x.dayKnown)) + ")</option>").join("") +
    "</select></div>" +
    '<div style="margin-top:13px">' +
      '<div class="chiprow" style="margin-bottom:7px">' +
        '<span class="chip marine" id="clProg">' + p.done + " of " + p.total +
          " required fields in · " + p.pct + "%</span>" +
        '<span class="chip partner">Partner ' + p.byOwner.partner[0] + "/" + p.byOwner.partner[1] + "</span>" +
        '<span class="chip speaker">Speaker ' + p.byOwner.speaker[0] + "/" + p.byOwner.speaker[1] + "</span>" +
        '<span class="chip">botiss ' + p.byOwner.botiss[0] + "/" + p.byOwner.botiss[1] + "</span>" +
      "</div>" +
      '<div class="meter">' +
        '<i class="p" style="width:' + w("partner") + '%"></i>' +
        '<i class="s" style="width:' + w("speaker") + '%"></i>' +
        '<i class="b" style="width:' + w("botiss") + '%"></i>' +
      "</div>" +
    "</div>" +
    '<div class="btnrow" style="margin-top:13px">' +
      '<button class="btn" id="chasePartner">' + ICON.copy + "Copy what the partner still owes</button>" +
      '<button class="btn" id="chaseSpeaker">' + ICON.copy + "Copy what the speaker still owes</button>" +
      '<button class="btn" id="clDownload">' + ICON.down + "Download the filled checklist</button>" +
    "</div></section>";

  const sections = CHECKLIST.map(sec => {
    const isOpen = !!clOpen[sec.id];
    const reqs = sec.items.filter(i => i.required);
    const doneN = reqs.filter(i => itemAnswered(i, c)).length;
    const chip = !reqs.length ? '<span class="chip idle">optional</span>'
      : doneN === reqs.length ? '<span class="chip done">' + ICON.check + "complete</span>"
      : '<span class="chip waiting">' + doneN + " of " + reqs.length + "</span>";
    return '<section class="cl" data-open="' + isOpen + '">' +
      '<button class="clhead" data-clsec="' + sec.id + '" aria-expanded="' + isOpen + '">' +
        "<h3>" + esc(sec.title) + "</h3>" + chip +
        '<span class="caret">' + ICON.caret + "</span></button>" +
      (isOpen ? '<div class="clbody">' + sec.items.map(it => clItem(it, c)).join("") + "</div>" : "") +
    "</section>";
  }).join("");

  return '<div class="stack">' + picker +
    (brandSlip(e.name)
      ? '<div class="notice bad">' + ICON.warn + '<div class="nbody"><strong>This event’s name reads “DAY”.</strong> ' +
        'The flyer brand must read “' + esc(BRAND) + '”.</div></div>'
      : "") +
    sections + "</div>";
}

function ownerChip(owner){
  const cls = owner === "partner" ? "partner" : owner === "speaker" ? "speaker" : "marine";
  return '<span class="chip ' + cls + '">' + OWNERS[owner] + "</span>";
}

function clItem(it, c){
  const v = c.values[it.id];
  const done = itemAnswered(it, c);
  const id = "cl-" + it.id;
  const head = '<div class="cltop"><div class="cllab">' + esc(it.label) +
    (it.required || it.type === "fixed"
      ? "" : ' <span class="mutedcell" style="font-weight:400">optional</span>') + "</div>" +
    ownerChip(it.owner) +
    (done && it.type !== "fixed" ? '<span class="chip done">' + ICON.check + "in</span>" : "") +
    "</div>" + (it.hint ? '<div class="clhint">' + esc(it.hint) + "</div>" : "");

  let field = "";
  switch (it.type) {
    case "fixed":
      field = '<div class="clfield"><input id="' + id + '" value="' + esc(it.value) +
        '" readonly aria-label="' + esc(it.label) + '" style="background:var(--surface-2)"></div>';
      break;
    case "text":
      field = '<div class="clfield"><input id="' + id + '" data-cl="' + it.id +
        '" aria-label="' + esc(it.label) + '" value="' + esc(v || "") + '"></div>';
      break;
    case "textarea":
      field = '<div class="clfield"><textarea id="' + id + '" data-cl="' + it.id +
        '" aria-label="' + esc(it.label) + '">' + esc(v || "") + "</textarea></div>";
      break;
    case "check":
      field = '<div class="clfield"><label class="tick" for="' + id + '">' +
        '<input type="checkbox" id="' + id + '" data-clcheck="' + it.id + '"' +
        (v === true ? " checked" : "") + "> Done</label></div>";
      break;
    case "checkqty":
      field = '<div class="clfield"><label class="tick" for="' + id + '">' +
        '<input type="checkbox" id="' + id + '" data-clcheck="' + it.id + '"' +
        (v === true ? " checked" : "") + "> Needed</label>" +
        '<div class="qtyrow"><div><label class="fld" for="' + id + '-q">Per participant</label>' +
          '<input id="' + id + '-q" data-clqty="' + it.id + '" value="' +
          esc(c.values[it.id + "__qty"] || "") + '" placeholder="e.g. 2"></div>' +
        '<div><label class="fld" for="' + id + '-n">Notes</label>' +
          '<input id="' + id + '-n" data-clnote="' + it.id + '" value="' +
          esc(c.values[it.id + "__note"] || "") + '" placeholder="size, amount, anything to specify"></div>' +
        "</div></div>";
      break;
    case "checkset": {
      const on = Array.isArray(v) ? v : [];
      field = '<div class="subs">' + it.subs.map((s, i) =>
        '<label for="' + id + "-" + i + '"><input type="checkbox" id="' + id + "-" + i +
        '" data-clset="' + it.id + '" data-sub="' + esc(s) + '"' +
        (on.indexOf(s) > -1 ? " checked" : "") + "> " + esc(s) + "</label>").join("") + "</div>";
      break;
    }
    case "tags": {
      const full = c.tags.length >= TAG_CAP;
      field = '<div class="clfield">' +
        '<div class="label">Products</div><div class="tagpool">' +
          CAMPUS_TAGS.products.map(t => tagBtn(t, c, full)).join("") + "</div>" +
        '<div class="label" style="margin-top:11px">Indications</div><div class="tagpool">' +
          CAMPUS_TAGS.indications.map(t => tagBtn(t, c, full)).join("") + "</div>" +
        '<div class="clhint" style="margin-top:9px">' + c.tags.length + " of " + TAG_CAP + " chosen" +
          (full ? " — the cap is reached, unpick one to swap" : "") + "</div></div>";
      break;
    }
    case "timetable":
      field = '<div class="tt">' + TIMETABLE.map(r =>
        r.kind === "break"
          ? '<div class="ttrow"><div class="tmark">' + r.t + '</div><div class="tbreak">' +
            esc(r.label) + "</div></div>"
          : '<div class="ttrow"><div class="tmark">' + r.t + "</div>" +
            '<input id="tt-' + r.key + '" data-cltt="' + r.key + '" aria-label="' +
            esc(r.label) + " at " + r.t + '" value="' + esc(c.tt[r.key] || "") +
            '" placeholder="' + esc(r.label) + ' — title or speaker"></div>').join("") + "</div>";
      break;
    case "speakers":
      field = '<div class="clfield">' + c.speakers.map((s, i) => speakerBlock(s, i)).join("") +
        '<div class="btnrow" style="margin-top:10px"><button class="btn sm" id="addSpeaker">' +
        ICON.plus + (c.speakers.length ? "Add another speaker" : "Add a speaker") + "</button></div></div>";
      break;
  }
  return '<div class="cli' + (done && it.type !== "fixed" ? " done" : "") + '">' + head + field + "</div>";
}

      ICON.trash + "</button></h4>" +

        '<input id="spk-hoAbstract-' + i + '" data-spk="' + i + '" data-spkf="hoAbstract" value="' +
        esc(s.hoAbstract || "") + '" placeholder="only if different"></div>' +

function buildChecklistText(eventId){
  const e = S.events.find(x => x.id === eventId);
  const c = clFor(eventId);
  const L = [BRAND, eventTitle(e) + " — " + fmtDate(e.date), ""];
  CHECKLIST.forEach(sec => {
    L.push(sec.title.toUpperCase());
    sec.items.forEach(it => {
      const v = c.values[it.id];
      const tag = "[" + OWNERS[it.owner] + "]";
      if (it.type === "fixed") { L.push("- " + it.label + ": " + it.value + " " + tag); return; }
      if (it.type === "tags") {
        L.push("- botissCAMPUS tags " + tag + ": " + (c.tags.length ? c.tags.join(", ") : "not chosen yet"));
        return;
      }
      if (it.type === "timetable") {
        L.push("- Timetable " + tag + ":");
        TIMETABLE.forEach(r => L.push("    " + r.t + "  " +
          (r.kind === "break" ? r.label : (c.tt[r.key] || "????"))));
        return;
      }
      if (it.type === "speakers") {
        if (!c.speakers.length) { L.push("- Speakers " + tag + ": none entered yet"); return; }
        c.speakers.forEach((s, i) => {
          L.push("- Speaker " + (i + 1) + " " + tag);
          L.push("    Lecture title: " + (s.title || "????"));
          L.push("    Speaker:       " + (s.name || "????"));
          L.push("    Abstract:      " + (s.abstract || "????"));
          L.push("    CV:            " + (s.cv || "????"));
          if (s.hoTitle) L.push("    Hands-on title:    " + s.hoTitle);
          if (s.hoAbstract) L.push("    Hands-on abstract: " + s.hoAbstract);
        });
        return;
      }
      if (it.type === "checkset") {
        const on = Array.isArray(v) ? v : [];
        L.push("- " + it.label + " " + tag + ": " + (on.length ? on.join(", ") : "nothing ticked"));
        return;
      }
      if (it.type === "check") {
        L.push("- " + it.label + " " + tag + ": " + (v === true ? "done" : "not yet")); return;
      }
      if (it.type === "checkqty") {
        const q = c.values[it.id + "__qty"], n = c.values[it.id + "__note"];
        L.push("- " + it.label + " " + tag + ": " + (v === true ? "needed" : "not needed") +
          (q ? " · " + q + " per participant" : "") + (n ? " · " + n : ""));
        return;
      }
      L.push("- " + it.label + " " + tag + ": " + (v && String(v).trim() ? String(v).trim() : "????"));
    });
    L.push("");
  });
  const p = clProgress(eventId);
  L.push("Required fields in: " + p.done + " of " + p.total + " (" + p.pct + "%)");
  return L.join("\n");
}

function parseMoney(v){
  if (typeof v === "number") return Number.isFinite(v) ? v : 0;
  let s = String(v == null ? "" : v).replace(/[€$\s ]/g, "").trim();
  if (!s || /^[-–—]$/.test(s)) return 0;
  const neg = /^\(.*\)$/.test(s);
  s = s.replace(/[()]/g, "");
  const lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
  if (lastComma > -1 && lastDot > -1) {
    if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (lastComma > -1) {
    s = (s.length - lastComma - 1) === 3 ? s.replace(/,/g, "") : s.replace(",", ".");
  } else if (lastDot > -1) {
    if ((s.length - lastDot - 1) === 3 && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  }
  const n = parseFloat(s.replace(/[^0-9.\-]/g, ""));
  if (!Number.isFinite(n)) return 0;
  return neg ? -n : n;
}

/* "Bulgaria-Ultradental 4+1" -> Bulgaria / Ultradental / 4+1, with a "?"
   kept as an unconfirmed-name flag rather than edited away. */
function splitLabel(raw){
  let s = String(raw || "").trim();
  const uncertain = s.indexOf("?") > -1;
  s = s.replace(/\?/g, "").trim();
  let terms = "";
  const t = s.match(/(\d\s*\+\s*\d)\s*$/);
  if (t) { terms = t[1].replace(/\s+/g, ""); s = s.slice(0, t.index).trim(); }
  let country = s, distributor = "";
  const dash = s.match(/^(.*?)\s*[-–—]\s*(.+)$/);
  if (dash) { country = dash[1].trim(); distributor = dash[2].trim(); }
  else {
    const sp = s.match(/^(\S+)\s+(.+)$/);
    if (sp) { country = sp[1].trim(); distributor = sp[2].trim(); }
  }
  return { country, distributor, terms, uncertain, raw:String(raw || "").trim() };
}

function guessColumns(headers){
  const find = function(){
    for (let k = 0; k < arguments.length; k++) {
      const p = arguments[k];
      const i = headers.findIndex(h => p.test(String(h || "")));
      if (i > -1) return i;
    }
    return -1;
  };
  const year = new Date().getFullYear();
  const fb = (i, alt) => i > -1 ? i : Math.min(alt, Math.max(headers.length - 1, 0));
  return {
    country: fb(find(/^\s*(country|land|region)\s*$/i, /countr|land/i, /distrib|partner/i), 0),
    q3:      fb(find(/q[1-4]\s*target/i, /^\s*q[1-4]\b/i), 1),
    booked:  fb(find(new RegExp("^\\s*" + year + "\\s*$"), /booked|actual|ytd|umsatz|ist/i), 2),
    target:  fb(find(new RegExp("^\\s*" + year + "\\s*target\\s*$", "i"), /target|ziel|plan|budget/i), 3)
  };
}

function openMapper(matrix){
  const rows = matrix.filter(r => Array.isArray(r) &&
    r.some(c => String(c == null ? "" : c).trim() !== ""));
  if (rows.length < 2) { toast("Could not find any rows in that. Check the sheet and try again."); return; }
  let hi = 0, best = -1;
  rows.slice(0, 10).forEach((r, i) => {
    const score = r.filter(c => typeof c === "string" && c.trim() !== "").length;
    if (score > best) { best = score; hi = i; }
  });
  const headers = rows[hi].map(h => String(h == null ? "" : h).trim());
  const width = Math.max.apply(null, [headers.length].concat(rows.map(r => r.length)));
  while (headers.length < width) headers.push("column " + (headers.length + 1));
  mapper = { headers, rows: rows.slice(hi + 1), guess: guessColumns(headers) };

  /* The 2026_plan "revenues" layout is recognised outright: a Country
     column, a "Q3 target" column and a bare-year booked column. */
  const year = String(new Date().getFullYear());
  const known = /^\s*country\s*$/i.test(headers[0] || "") &&
    headers.some(h => /q[1-4]\s*target/i.test(String(h))) &&
    headers.some(h => String(h).trim() === year);
  if (known) { applyMapper(true); return; }
  render();
}

function applyMapper(auto){
  const pick = id => { const el = document.getElementById(id); return el ? parseInt(el.value, 10) : -1; };
  const g = mapper.guess;
  const c = auto ? g.country : pick("mapCountry");
  const q = auto ? g.q3      : pick("mapTarget");
  const b = auto ? g.booked  : pick("mapBooked");
  const f = auto ? g.target  : pick("mapFull");
  const out = [];
  mapper.rows.forEach(r => {
    const label = String(r[c] == null ? "" : r[c]).trim();
    if (!label) return;
    if (/^(total|sum|summe|gesamt|growth)\b/i.test(label)) return;
    const s = splitLabel(label);
    if (!s.country) return;
    const full = f > -1 ? parseMoney(r[f]) : 0;
    out.push({ id:uid(), country:s.country, distributor:s.distributor, terms:s.terms,
      uncertain:s.uncertain, raw:s.raw,
      q3: parseMoney(r[q]), booked: parseMoney(r[b]), target: full,
      plan26: 0, plan27: 0, budget: Math.round(full * 0.05 * 100) / 100, months: {} });
  });
  if (!out.length) { toast("Those columns produced no rows. Try a different mapping."); return; }
  S.distributors = out;
  S.asOf = todayISO();
  mapper = null;
  commit();
  toast("Loaded " + out.length + " distributors" +
    (auto ? " — the revenues layout was recognised." : "."));
}
